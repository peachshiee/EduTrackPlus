<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify email | EduTrack Plus</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth-pages.css">
  <script src="js/verify-otp.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card auth-card-compact">
      <a class="auth-brand" href="index.html">EduTrack <span>Plus</span></a>
      <p class="auth-kicker">EMAIL VERIFICATION</p>
      <h1>Check your inbox</h1>
      <p class="auth-intro">Enter the six-digit code we sent to your registered email. The code expires in 10 minutes.</p>
      <form id="otpForm">
        <label>Verification code
          <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" minlength="6" placeholder="000000" required>
        </label>
        <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
        <button class="auth-submit" type="submit">Verify code</button>
      </form>
      <p class="auth-bottom"><a href="login.html">Return to sign in</a></p>
    </section>
  </main>
</body>
</html>
