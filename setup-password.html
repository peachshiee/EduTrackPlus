<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set up password | EduTrack Plus</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth-pages.css">
  <script src="js/setup-password.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-brand" href="index.html">EduTrack <span>Plus</span></a>
      <p class="auth-kicker">FIRST-TIME SETUP</p>
      <h1>Create your password</h1>
      <p class="auth-intro">Use this for an account already prepared by your school. Verify your school-registered email first.</p>

      <form id="requestSetupForm">
        <label>School ID number
          <input id="schoolId" name="schoolId" autocomplete="username" maxlength="40" required>
        </label>
        <label>Email address
          <input id="email" name="email" type="email" autocomplete="email" required>
        </label>
        <p id="requestMessage" class="form-message" role="status" aria-live="polite"></p>
        <button class="auth-submit" type="submit">Send verification code</button>
      </form>

      <form id="completeSetupForm" hidden>
        <label>New password
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="50" required>
          <small>8–50 characters, with uppercase, lowercase, and at least one symbol.</small>
        </label>
        <label>Confirm password
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
        </label>
        <p id="completeMessage" class="form-message" role="status" aria-live="polite"></p>
        <button class="auth-submit" type="submit">Save password</button>
      </form>
      <p class="auth-bottom"><a href="login.html">Back to sign in</a></p>
    </section>
  </main>
</body>
</html>
